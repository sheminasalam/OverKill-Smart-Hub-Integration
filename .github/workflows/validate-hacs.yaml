name: HACS validation

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  validate:
    name: HACS validation and package checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate repository with HACS
        uses: hacs/action@main
        with:
          category: integration
      - name: Check integration package metadata and license
        run: python scripts/validate_repo.py
      - name: Compile integration Python source
        run: PYTHONPYCACHEPREFIX=/tmp/overkill-pycache python -m compileall -q custom_components/overkill_smart_hub
