name: Custom HACS compatibility

# The official HACS Action also enforces eligibility for the default HACS list.
# This repository intentionally uses PolyForm Noncommercial, which is incompatible
# with default-list inclusion. These checks validate the supported custom-repository
# installation path without misrepresenting default-store eligibility.

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate HACS custom-repository structure, metadata and chosen license
        run: python scripts/validate_repo.py
      - name: Compile integration Python source
        run: PYTHONPYCACHEPREFIX=/tmp/overkill-pycache python -m compileall -q custom_components/overkill_smart_hub
