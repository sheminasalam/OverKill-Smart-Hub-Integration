name: Static checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Compile Python source
        run: PYTHONPYCACHEPREFIX=/tmp/overkill-pycache python -m compileall -q custom_components/overkill_smart_hub
      - name: Validate repository structure and metadata
        run: python scripts/validate_repo.py
