name: Populate repository from release package

on:
  push:
    branches:
      - main
    paths:
      - "bootstrap/READY"

permissions:
  contents: write

jobs:
  populate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Reconstruct and validate release package
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/part-*.b64 | base64 --decode > /tmp/overkill-integration.zip
          unzip -t /tmp/overkill-integration.zip
          mkdir -p /tmp/overkill-package
          unzip -q /tmp/overkill-integration.zip -d /tmp/overkill-package
          cp -a /tmp/overkill-package/. .
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap-publish.yaml
          python scripts/validate_repo.py
          python -m compileall -q custom_components/overkill_smart_hub

      - name: Commit the HACS repository files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':!.github/workflows'
          git commit -m "Add OverKill Smart Hub HACS integration release candidate"
          git push